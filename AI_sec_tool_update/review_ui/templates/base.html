<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lượt phân tích{% endblock %} · Security Review</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block scripts %}{% endblock %}
</head>
<body>
  <a class="skip" href="#content">Đi tới nội dung</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="{{ url_for('index') }}" class="brand"><span class="logo" aria-hidden="true">SR</span> Security Review</a>
      <nav aria-label="Điều hướng chính">
        <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} aria-current="page"{% endif %}>Lượt phân tích</a>
      </nav>
      <span class="local-mode">Dữ liệu cục bộ</span>
    </div>
  </header>
  <main id="content" class="shell">{% block content %}{% endblock %}</main>
</body>
</html>
